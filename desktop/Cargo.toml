[package]
name = "openschool"
version = "0.1.0"
edition = "2021"
description = "Дневник МЭШ на рабочем столе: Linux и macOS"
license = "MIT"

[[bin]]
name = "openschool"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.37"
ureq = { version = "2.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
webbrowser = "1"

[profile.release]
opt-level = 2
lto = "thin"
